# 本地情报目录（相对工作目录）；只依赖本地文件，无任何外部服务
intel.directory=intel-data
# 受限来源：仅这些 feed 产出的指标明细需要权限
intel.restricted-sources[0]=restricted-intel.csv
# 来源 -> 所需角色（逗号分隔）；未配置时默认要求 restricted-intel:reader
intel.source-roles.restricted-intel.csv=restricted-intel:reader
# 启动完成后自动刷新一次
intel.refresh-on-startup=true

# 输出日志中的输入与判定依据
logging.level.com.github.xingjianluo.threatinteliocjava=INFO
